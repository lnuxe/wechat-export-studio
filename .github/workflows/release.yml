name: Release

# 推一个 v* 标签就出安装包并发布 Release。
# 也可以手动触发（workflow_dispatch）用于演练，此时只上传 artifact，不碰 Release。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Encoding check
        run: npm run check:encoding

      - name: Typecheck
        run: npm run typecheck

      # runner 上没装微信，冒烟会走「skip 环境相关断言」的路径。
      # 这一步真正的价值是验证：主进程能起来、模块能加载、SQLCipher 参数与代码一致。
      - name: Smoke (self-check with graceful skips)
        run: npm run smoke

      - name: Generate app icon
        run: npm run icon

      # --publish never 是必须的：electron-builder 一旦检测到 CI 就会「隐式发布」，
      # 找不到 GH_TOKEN 时直接以退出码 1 结束——即使安装包已经构建成功，
      # 后续的上传 artifact 与发布步骤都会被跳过（Release #1 就是这样挂的）。
      # 发布由下面自己的脚本负责，构建步骤只负责构建。
      - name: Package (NSIS installer)
        run: npx electron-builder --win --config electron-builder.yml --publish never
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
          ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

      - name: Show artifacts
        shell: pwsh
        run: Get-ChildItem release -File | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} | Format-Table -AutoSize

      - name: Upload installer as build artifact
        uses: actions/upload-artifact@v5
        with:
          name: wechat-export-studio-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 14

      # 发布走我们自己的脚本而不是 electron-builder --publish：
      # 它会把 sha256 回填进 Release 说明，并且幂等（可重复执行）。
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/publish-release.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
